<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerCompass Admin</title>
<style>
:root{--p:#0E9F8A;--pd:#087A6B;--side:#10243B;--bg:#F3F7FA;--card:#fff;--tx:#172B3F;--mu:#63758A;--bd:#DCE6EC;--red:#DC2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}input,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;margin:4px 0 12px}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:320px}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}.btn:hover{background:var(--pd)}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:#EEF2FF;color:var(--pd)}.btn.d{background:#FEE2E2;color:var(--red)}
#login{max-width:420px;margin:10vh auto;background:var(--card);padding:32px;border-radius:18px;box-shadow:0 14px 40px #10243b16;border:1px solid var(--bd)}
#login h1{margin:0 0 4px;color:var(--tx)}.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}.login-logo{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:14px;border:1px solid var(--bd)}.err{color:var(--red);min-height:20px;font-size:14px}
.password-field{position:relative}.password-field input{padding-right:48px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-65%);border:0;background:transparent;color:var(--mu);padding:7px;display:grid;place-items:center}.password-toggle:hover{color:var(--pd)}.password-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{display:none;min-height:100vh}aside{width:230px;background:var(--side);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;overflow:auto}
aside h2{margin:0;font-size:17px;line-height:1.2}aside nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#C4D4E3;padding:10px 12px;border-radius:9px;font-size:14px}
aside nav button:hover,aside nav button.on{background:var(--p);color:#fff}aside small{display:block;margin:14px 8px;color:#C4D4E3;word-break:break-all}.brand-lockup{display:flex;align-items:center;gap:11px;padding:4px 6px 22px;margin-bottom:8px;border-bottom:1px solid #ffffff24}.brand-icon{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:13px;padding:4px;flex:none}.brand-subtitle{display:block;color:#91A9BD;font-size:11px;margin-top:4px;letter-spacing:.05em;text-transform:uppercase}
main{margin-left:230px;padding:32px;min-height:100vh;display:flex;flex-direction:column}.main-content{flex:1}h2.t{margin-top:0}.dashboard-intro{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:0 0 26px}.dashboard-intro h1{margin:0;font-size:32px;letter-spacing:-.03em}.dashboard-intro p{margin:7px 0 0;color:var(--mu)}.live-badge{display:inline-flex;align-items:center;gap:8px;background:#E5F5F1;color:#087A6B;padding:9px 13px;border-radius:999px;font-size:13px;font-weight:650;white-space:nowrap}.live-dot{width:8px;height:8px;background:#0E9F8A;border-radius:50%}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--p);border-radius:17px;padding:23px;min-height:174px;box-shadow:0 6px 18px #10243b0a;transition:transform .16s ease,box-shadow .16s ease}.card:hover{transform:translateY(-3px);box-shadow:0 12px 24px #10243b15}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.card-label{color:var(--mu);font-size:15px;font-weight:650}.card-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#E8F5F2;color:var(--pd);font-size:22px}.card b{font-size:44px;line-height:1.1;display:block;margin-top:18px;letter-spacing:-.04em}.card-caption{color:var(--mu);font-size:12px;margin-top:6px;display:block}
.site-footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--bd);padding:20px 0 4px;margin-top:36px;color:var(--mu);font-size:12px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}
th{background:#EEF2FF;color:var(--pd)}td.pv{color:var(--mu);font-family:ui-monospace,monospace;font-size:12px;max-width:380px;word-break:break-all}td.a{white-space:nowrap}td.a button{margin-right:4px}
dialog{border:0;border-radius:14px;padding:22px;width:min(680px,94vw)}dialog::backdrop{background:#0006}dialog h3{margin-top:0;color:var(--p)}
@media(max-width:760px){aside{position:static;width:auto;padding:12px}aside nav{display:flex;gap:4px;overflow-x:auto}aside nav button{width:auto;white-space:nowrap}main{margin:0;padding:18px;min-height:calc(100vh - 125px)}table{display:block;overflow-x:auto}.bar{align-items:flex-start;flex-direction:column}.dashboard-intro{align-items:flex-start;flex-direction:column}.dashboard-intro h1{font-size:28px}.cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{min-height:155px;padding:19px}.card b{font-size:40px}.site-footer{flex-direction:column}.login-brand{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<form id="login">
  <div class="login-brand"><img class="login-logo" src="./brand-icon.png" alt="CareerCompass app icon"><h1>CareerCompass Admin</h1></div><p style="color:var(--mu);margin-top:0">Sign in with an admin account.</p>
  <label for="email">Email<input id="email" type="email" autocomplete="username" autocapitalize="none" required></label>
  <label for="pass">Password</label>
  <div class="password-field"><input id="pass" type="password" autocomplete="current-password" required><button class="password-toggle" id="togglePass" type="button" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.7-7 10-7 10 7 10 7-3.7 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path id="eyeSlash" d="m3 3 18 18" style="display:none"></path></svg></button></div>
  <div class="err" id="msg" role="status" aria-live="polite"></div><button class="btn" id="loginButton" style="width:100%">Sign in</button>
</form>
<div id="app">
  <aside><div class="brand-lockup"><img class="brand-icon" src="./brand-icon.png" alt=""><div><h2>CareerCompass</h2><span class="brand-subtitle">Admin Console</span></div></div><nav id="nav"></nav><small id="who"></small><button class="btn g s" id="out" style="margin-left:8px">Sign out</button></aside>
  <main><div id="main" class="main-content"></div><footer class="site-footer"><span>CareerCompass Admin · Learner guidance management</span><span>Discover · Plan · Achieve</span></footer></main>
</div>
<dialog id="dlg"></dialog>

<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, limit, getCountFromServer, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const auth = getAuth(initializeApp(firebaseConfig)), db = getFirestore(auth.app);
const CONTENT = ["faqs","notifications","bursaries","universities","colleges","courses","applicationDeadlines","subjects"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = on => { $("#login").style.display = on ? "none" : "block"; $("#app").style.display = on ? "block" : "none"; };
const main = h => ($("#main").innerHTML = h);
// Firestore timestamps <-> JSON so dates survive editing
const toJson = o => JSON.stringify(o, function (k, v) { const x = this[k]; return x && typeof x.toDate === "function" ? { __date: x.toDate().toISOString() } : v; }, 2);
const fromJson = t => JSON.parse(t, (k, v) => (v && v.__date ? Timestamp.fromDate(new Date(v.__date)) : v));
const rows = {};
let loginInProgress = false;
let activeAdminUid = null;
let viewGeneration = 0;

function openAdmin(user) {
  activeAdminUid = user.uid;
  $("#who").textContent = user.email; show(true);
  const labels = {faqs:"FAQs",notifications:"Notifications",bursaries:"Funding",universities:"Universities",colleges:"Colleges",courses:"Courses",applicationDeadlines:"Application deadlines",subjects:"Subjects"};
  $("#nav").innerHTML = [["dashboard","Dashboard"],["users","Users"],...CONTENT.map(c => [c, labels[c]])]
    .map(([k, l]) => `<button data-go="${k}">${l}</button>`).join("");
  go("dashboard");
}

async function verifyAdmin(user) {
  let adminDoc;
  try {
    adminDoc = await getDoc(doc(db, "admins", user.uid));
  } catch (error) {
    $("#msg").style.color = "var(--red)";
    $("#msg").textContent = `Signed in, but admin access could not be checked (${error.code || "Firestore error"}). Check your connection and try again.`;
    return false;
  }
  if (!adminDoc.exists()) {
    $("#msg").textContent = "This account signed in, but it is not registered as an admin.";
    await signOut(auth).catch(() => {});
    return false;
  }
  $("#msg").textContent = "";
  openAdmin(user);
  return true;
}

const loginButton = $("#loginButton");
loginButton.disabled = true;
async function initializeLogin() {
  try {
    // Clear the browser's previous LOCAL Firebase session and keep this login
    // only in memory, so reopening or refreshing the admin page asks for a password.
    await signOut(auth);
    await setPersistence(auth, inMemoryPersistence);
    onAuthStateChanged(auth, user => {
      if (!user) {
        activeAdminUid = null;
        show(false);
        return;
      }
      if (loginInProgress || activeAdminUid === user.uid) return;
      show(false);
      $("#msg").textContent = "Checking admin access…";
      verifyAdmin(user).catch(error => {
        $("#msg").textContent = `Could not open the admin dashboard (${error.code || error.message}).`;
      });
    });
    loginButton.disabled = false;
  } catch (error) {
    $("#msg").textContent = `Could not prepare a fresh sign-in session (${error.code || "auth error"}). Reload the page and try again.`;
  }
}
initializeLogin();

$("#login").onsubmit = async e => {
  e.preventDefault(); $("#msg").textContent = "";
  $("#msg").style.color = "var(--red)";
  if (loginInProgress) return;
  loginInProgress = true;
  loginButton.disabled = true;
  loginButton.textContent = "Signing in…";
  try {
    const credential = await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#pass").value);
    await verifyAdmin(credential.user);
  } catch (err) {
    const messages = {
      "auth/invalid-credential": "Incorrect email or password. Check both and try again.",
      "auth/wrong-password": "Incorrect password. Check it and try again.",
      "auth/user-not-found": "No account was found for that email address.",
      "auth/invalid-email": "Enter a valid email address.",
      "auth/too-many-requests": "Too many attempts. Wait a while, then try again.",
      "auth/network-request-failed": "Could not reach Firebase. Check your internet connection and try again.",
      "auth/operation-not-allowed": "Email and password sign-in is disabled in Firebase Authentication."
    };
    $("#msg").textContent = messages[err.code] || `Sign-in failed (${err.code || "unknown error"}). Please try again.`;
  } finally {
    loginInProgress = false;
    loginButton.disabled = false;
    loginButton.textContent = "Sign in";
  }
};
$("#togglePass").onclick = () => {
  const input = $("#pass"), visible = input.type === "password";
  input.type = visible ? "text" : "password";
  $("#togglePass").setAttribute("aria-label", visible ? "Hide password" : "Show password");
  $("#togglePass").title = visible ? "Hide password" : "Show password";
  $("#togglePass").setAttribute("aria-pressed", String(visible));
  $("#eyeSlash").style.display = visible ? "block" : "none";
};
$("#out").onclick = () => signOut(auth);

function go(v) {
  const generation = ++viewGeneration;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.go === v));
  main("<p>Loading...</p>");
  const load = v === "dashboard" ? dashboard : v === "users" ? users : (token) => content(v, token);
  load(generation).catch(e => {
    if (generation === viewGeneration) main(`<p class="err">${esc(e.message)}</p>`);
  });
}

async function dashboard(generation) {
  const items = [
    ["users","User profiles","👥"], ["faqs","FAQs","❓"], ["notifications","Notifications","🔔"],
    ["bursaries","Funding","🎓"], ["universities","Universities","🏛️"], ["colleges","Colleges","🏫"],
    ["courses","Courses","📚"], ["applicationDeadlines","Application deadlines","📅"], ["subjects","Subjects","🧭"]
  ];
  const counts = await Promise.all(items.map(async ([collectionName,label,icon]) => {
    const c = (await getCountFromServer(collection(db, collectionName)).catch(() => null))?.data().count ?? "-";
    return `<div class="card"><div class="card-top"><span class="card-label">${esc(label)}</span><span class="card-icon" aria-hidden="true">${icon}</span></div><b>${c}</b><span class="card-caption">records in Firebase</span></div>`;
  }));
  if (generation !== viewGeneration) return;
  main(`<section class="dashboard-intro"><div><h1>Dashboard</h1><p>A clear overview of CareerCompass activity and content.</p></div><span class="live-badge"><span class="live-dot"></span>Live Firebase data</span></section><div class="cards">${counts.join("")}</div>`);
}

async function users(generation) {
  const s = await getDocs(query(collection(db, "users"), limit(300)));
  if (generation !== viewGeneration) return;
  s.docs.forEach(d => (rows[d.id] = d.data()));
  main(`<div class="bar"><h2 class="t" style="margin:0">User profiles (${s.size}${s.size === 300 ? "+, first 300" : ""})</h2><input id="userSearch" type="search" placeholder="Search loaded users by name or email" aria-label="Search users"></div><table id="userTable"><tr><th>Name</th><th>Email</th><th>Access</th><th></th></tr>${
    s.docs.map(d => { const u = d.data(); const restricted = u.appRestricted === true; return `<tr><td>${esc(u.name || "—")}</td><td>${esc(u.email || "—")}</td><td>${restricted ? "Restricted" : "Active"}</td>
    <td class="a"><button class="btn s g" data-act="apps" data-id="${d.id}">Applications</button><button class="btn s g" data-act="euser" data-id="${d.id}">Edit</button><button class="btn s ${restricted ? "g" : "d"}" data-act="toggleRestriction" data-id="${d.id}">${restricted ? "Unrestrict" : "Restrict"}</button></td></tr>`; }).join("")}</table>`);
  $("#userSearch").addEventListener("input", e => {
    const term = e.target.value.trim().toLowerCase();
    document.querySelectorAll("#userTable tr[data-user]").forEach(row => { row.hidden = !row.dataset.user.includes(term); });
  });
  document.querySelectorAll("#userTable tr").forEach(row => {
    const cells = row.querySelectorAll("td");
    if (cells.length) row.dataset.user = `${cells[0].textContent} ${cells[1].textContent}`.toLowerCase();
  });
}

async function content(c, generation) {
  const s = await getDocs(query(collection(db, c), limit(100)));
  if (generation !== viewGeneration) return;
  s.docs.forEach(d => (rows[c + "/" + d.id] = d.data()));
  main(`<div class="bar"><h2 class="t" style="margin:0">${c} (${s.size}${s.size === 100 ? "+, showing first 100" : ""})</h2><button class="btn" data-act="edoc" data-c="${c}">+ Add document</button></div>
  <table><tr><th>ID</th><th>Data</th><th></th></tr>${s.docs.map(d => `<tr><td><b>${esc(d.id)}</b></td><td class="pv">${esc(toJson(d.data()).replace(/\s+/g, " ").slice(0, 140))}</td>
  <td class="a"><button class="btn s g" data-act="edoc" data-c="${c}" data-id="${esc(d.id)}">Edit</button><button class="btn s d" data-act="ddoc" data-c="${c}" data-id="${esc(d.id)}">Delete</button></td></tr>`).join("")}</table>`);
}

const dlg = h => { $("#dlg").innerHTML = h; $("#dlg").showModal(); };
const close = () => $("#dlg").close();
const reload = () => go(document.querySelector("#nav .on").dataset.go);

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-go],[data-act],[data-close]"); if (!t) return;
  const { go: g, act, id, c } = t.dataset;
  if (g) return go(g);
  if (t.dataset.close !== undefined) return close();
  try {
    if (act === "edoc") {
      const data = id ? toJson(rows[c + "/" + id]) : "{\n  \n}";
      dlg(`<h3>${id ? "Edit" : "Add"} document in ${c}</h3>Document ID<input id="did" value="${esc(id || "")}" ${id ? "disabled" : ""} placeholder="e.g. faq-8"><textarea id="dj">${esc(data)}</textarea>
      <div class="err" id="de"></div><button class="btn" data-act="sdoc" data-c="${c}">Save</button> <button class="btn g" data-close>Cancel</button>`);
    } else if (act === "sdoc") {
      const did = $("#did").value.trim(); if (!did) return ($("#de").textContent = "Enter a document ID.");
      let obj; try { obj = fromJson($("#dj").value); } catch { return ($("#de").textContent = "That is not valid JSON."); }
      await setDoc(doc(db, c, did), obj); close(); reload();
    } else if (act === "ddoc") {
      if (confirm(`Delete "${id}" from ${c}?`)) { await deleteDoc(doc(db, c, id)); reload(); }
    } else if (act === "euser") {
      const u = rows[id];
      dlg(`<h3>Edit profile</h3><p>Changes apply to this Firestore profile only; they do not change the Firebase Authentication account.</p>Name<input id="un" value="${esc(u.name)}">
      <button class="btn" data-act="suser" data-id="${id}">Save</button> <button class="btn g" data-close>Cancel</button>`);
    } else if (act === "suser") {
      await setDoc(doc(db, "users", id), { name: $("#un").value.trim() }, { merge: true }); close(); reload();
    } else if (act === "apps") {
      const s = await getDocs(collection(db, "users", id, "applications"));
      dlg(`<h3>Applications (${s.size})</h3>${s.size ? `<table><tr><th>University</th><th>Course</th><th>Status</th><th>Date</th></tr>${s.docs.map(d => { const a = d.data();
        return `<tr><td>${esc(a.university)}</td><td>${esc(a.course)}</td><td>${esc(a.status?.label)}</td><td>${esc(a.dateApplied)}</td></tr>`; }).join("")}</table>` : "<p>No applications yet.</p>"}<br><button class="btn g" data-close>Close</button>`);
    } else if (act === "toggleRestriction") {
      const u = rows[id];
      const restricted = u.appRestricted === true;
      const next = !restricted;
      const verb = next ? "Restrict" : "Unrestrict";
      if (!confirm(`${verb} ${u.name || u.email}? Their profile and saved data will stay in Firebase. ${next ? "They will be signed out and blocked from account-specific data." : "They will be able to sign in again."}`)) return;
      await setDoc(doc(db, "users", id), { appRestricted: next }, { merge: true });
      closeIfOpen(); reload();
    }
  } catch (err) { alert(err.message); }
});
function closeIfOpen() { if ($("#dlg").open) close(); }
</script>
</body>
</html>
