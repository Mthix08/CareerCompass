<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerCompass Admin</title>
<style>
:root{--p:#4F46E5;--pd:#3730A3;--side:#1E1B4B;--bg:#F5F6FA;--card:#fff;--tx:#1F2937;--mu:#6B7280;--bd:#E5E7EB;--red:#DC2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}input,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;margin:4px 0 12px}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:320px}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}.btn:hover{background:var(--pd)}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:#EEF2FF;color:var(--pd)}.btn.d{background:#FEE2E2;color:var(--red)}
#login{max-width:380px;margin:12vh auto;background:var(--card);padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001}
#login h1{margin:0 0 4px;color:var(--p)}.err{color:var(--red);min-height:20px;font-size:14px}
#app{display:none;min-height:100vh}aside{width:230px;background:var(--side);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;overflow:auto}
aside h2{margin:0 8px 14px;font-size:18px}aside nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#C7D2FE;padding:9px 10px;border-radius:8px}
aside nav button:hover,aside nav button.on{background:#4F46E5;color:#fff}aside small{display:block;margin:14px 8px;color:#A5B4FC;word-break:break-all}
main{margin-left:230px;padding:26px}h2.t{margin-top:0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;padding:16px;border-top:4px solid var(--p)}.card b{font-size:28px;display:block}.card span{color:var(--mu);font-size:13px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}
th{background:#EEF2FF;color:var(--pd)}td.pv{color:var(--mu);font-family:ui-monospace,monospace;font-size:12px;max-width:380px;word-break:break-all}td.a{white-space:nowrap}td.a button{margin-right:4px}
dialog{border:0;border-radius:14px;padding:22px;width:min(680px,94vw)}dialog::backdrop{background:#0006}dialog h3{margin-top:0;color:var(--p)}
@media(max-width:760px){aside{position:static;width:auto}main{margin:0;padding:14px}table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<form id="login">
  <h1>CareerCompass Admin</h1><p style="color:var(--mu);margin-top:0">Sign in with an admin account.</p>
  <label>Email<input id="email" type="email" required></label>
  <label>Password<input id="pass" type="password" required></label>
  <div class="err" id="msg"></div><button class="btn" style="width:100%">Sign in</button>
</form>
<div id="app">
  <aside><h2>Admin</h2><nav id="nav"></nav><small id="who"></small><button class="btn g s" id="out" style="margin-left:8px">Sign out</button></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>

<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, limit, getCountFromServer, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const auth = getAuth(initializeApp(firebaseConfig)), db = getFirestore(auth.app);
const CONTENT = ["faqs","notifications","bursaries","universities","courses","applicationDeadlines","subjects"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = on => { $("#login").style.display = on ? "none" : "block"; $("#app").style.display = on ? "block" : "none"; };
const main = h => ($("#main").innerHTML = h);
// Firestore timestamps <-> JSON so dates survive editing
const toJson = o => JSON.stringify(o, function (k, v) { const x = this[k]; return x && typeof x.toDate === "function" ? { __date: x.toDate().toISOString() } : v; }, 2);
const fromJson = t => JSON.parse(t, (k, v) => (v && v.__date ? Timestamp.fromDate(new Date(v.__date)) : v));
const rows = {};

onAuthStateChanged(auth, async user => {
  if (!user) return show(false);
  const ok = (await getDoc(doc(db, "admins", user.uid)).catch(() => null))?.exists();
  if (!ok) { await signOut(auth); $("#msg").textContent = "This account is not an admin."; return; }
  $("#who").textContent = user.email; show(true);
  $("#nav").innerHTML = [["dashboard","Dashboard"],["users","Users"],...CONTENT.map(c => [c, c])]
    .map(([k, l]) => `<button data-go="${k}">${l}</button>`).join("");
  go("dashboard");
});
$("#login").onsubmit = async e => {
  e.preventDefault(); $("#msg").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("#email").value, $("#pass").value); }
  catch { $("#msg").textContent = "Wrong email or password."; }
};
$("#out").onclick = () => signOut(auth);

function go(v) {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.go === v));
  main("<p>Loading...</p>");
  (v === "dashboard" ? dashboard : v === "users" ? users : () => content(v))().catch(e => main(`<p class="err">${esc(e.message)}</p>`));
}

async function dashboard() {
  main(`<h2 class="t">Dashboard</h2><div class="cards" id="cards"></div>`);
  for (const n of ["users","passwordHints","admins",...CONTENT]) {
    const c = (await getCountFromServer(collection(db, n)).catch(() => null))?.data().count ?? "-";
    $("#cards").insertAdjacentHTML("beforeend", `<div class="card"><b>${c}</b><span>${n}</span></div>`);
  }
}

async function users() {
  const s = await getDocs(query(collection(db, "users"), limit(300)));
  s.docs.forEach(d => (rows[d.id] = d.data()));
  main(`<div class="bar"><h2 class="t" style="margin:0">Users (${s.size})</h2></div><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Applications</th><th></th></tr>${
    s.docs.map(d => { const u = d.data(); return `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.applicationCount ?? 0}</td>
    <td class="a"><button class="btn s g" data-act="apps" data-id="${d.id}">Applications</button><button class="btn s g" data-act="euser" data-id="${d.id}">Edit</button><button class="btn s d" data-act="duser" data-id="${d.id}">Delete</button></td></tr>`; }).join("")}</table>`);
}

async function content(c) {
  const s = await getDocs(query(collection(db, c), limit(100)));
  s.docs.forEach(d => (rows[c + "/" + d.id] = d.data()));
  main(`<div class="bar"><h2 class="t" style="margin:0">${c} (${s.size}${s.size === 100 ? "+, showing first 100" : ""})</h2><button class="btn" data-act="edoc" data-c="${c}">+ Add document</button></div>
  <table><tr><th>ID</th><th>Data</th><th></th></tr>${s.docs.map(d => `<tr><td><b>${esc(d.id)}</b></td><td class="pv">${esc(toJson(d.data()).replace(/\s+/g, " ").slice(0, 140))}</td>
  <td class="a"><button class="btn s g" data-act="edoc" data-c="${c}" data-id="${esc(d.id)}">Edit</button><button class="btn s d" data-act="ddoc" data-c="${c}" data-id="${esc(d.id)}">Delete</button></td></tr>`).join("")}</table>`);
}

const dlg = h => { $("#dlg").innerHTML = h; $("#dlg").showModal(); };
const close = () => $("#dlg").close();
const reload = () => go(document.querySelector("#nav .on").dataset.go);

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-go],[data-act],[data-close]"); if (!t) return;
  const { go: g, act, id, c } = t.dataset;
  if (g) return go(g);
  if (t.dataset.close !== undefined) return close();
  try {
    if (act === "edoc") {
      const data = id ? toJson(rows[c + "/" + id]) : "{\n  \n}";
      dlg(`<h3>${id ? "Edit" : "Add"} document in ${c}</h3>Document ID<input id="did" value="${esc(id || "")}" ${id ? "disabled" : ""} placeholder="e.g. faq-8"><textarea id="dj">${esc(data)}</textarea>
      <div class="err" id="de"></div><button class="btn" data-act="sdoc" data-c="${c}">Save</button> <button class="btn g" data-close>Cancel</button>`);
    } else if (act === "sdoc") {
      const did = $("#did").value.trim(); if (!did) return ($("#de").textContent = "Enter a document ID.");
      let obj; try { obj = fromJson($("#dj").value); } catch { return ($("#de").textContent = "That is not valid JSON."); }
      await setDoc(doc(db, c, did), obj); close(); reload();
    } else if (act === "ddoc") {
      if (confirm(`Delete "${id}" from ${c}?`)) { await deleteDoc(doc(db, c, id)); reload(); }
    } else if (act === "euser") {
      const u = rows[id];
      dlg(`<h3>Edit user</h3>Name<input id="un" value="${esc(u.name)}">Phone<input id="up" value="${esc(u.phone)}">Category<input id="uc" value="${esc(u.category)}">
      <button class="btn" data-act="suser" data-id="${id}">Save</button> <button class="btn g" data-close>Cancel</button>`);
    } else if (act === "suser") {
      await setDoc(doc(db, "users", id), { name: $("#un").value.trim(), phone: $("#up").value.trim(), category: $("#uc").value.trim() }, { merge: true }); close(); reload();
    } else if (act === "apps") {
      const s = await getDocs(collection(db, "users", id, "applications"));
      dlg(`<h3>Applications (${s.size})</h3>${s.size ? `<table><tr><th>University</th><th>Course</th><th>Status</th><th>Date</th></tr>${s.docs.map(d => { const a = d.data();
        return `<tr><td>${esc(a.university)}</td><td>${esc(a.course)}</td><td>${esc(a.status?.label)}</td><td>${esc(a.dateApplied)}</td></tr>`; }).join("")}</table>` : "<p>No applications yet.</p>"}<br><button class="btn g" data-close>Close</button>`);
    } else if (act === "duser") {
      const u = rows[id];
      if (!confirm(`Delete ${u.name || u.email}'s data (profile, applications, password hint)?\nTheir login in Firebase Authentication is NOT removed.`)) return;
      const apps = await getDocs(collection(db, "users", id, "applications"));
      await Promise.all(apps.docs.map(d => deleteDoc(d.ref)));
      if (u.email) await deleteDoc(doc(db, "passwordHints", encodeURIComponent(u.email.toLowerCase()))).catch(() => {});
      await deleteDoc(doc(db, "users", id)); reload();
    }
  } catch (err) { alert(err.message); }
});
</script>
</body>
</html>
